name: "Git Config & Credentials"
description: "Configure git credentials, username etc."
branding:
  icon: "settings"
  color: "orange"
inputs:
  scope:
    description: |
      Scope to write the config to (`global`, `local` or `system`).
      `global` does not write to `~/.gitconfig`. It keeps the config in a file private to the
      current job via `GIT_CONFIG_GLOBAL`, so that credentials cannot be read by a later job on
      the same runner. This requires git 2.32 or later.
    default: global
  github-token:
    description: GitHub personal access token used as git credentials
  github-host:
    description: GitHub server hostname
    default: github.com
  config:
    description: |
      Git config variables to set, written in YAML. Keys may be written either in dotted form
      (`user.name: foo`) or nested (`user: {name: foo}`). All values must be scalars.

runs:
  using: "node24"
  main: "dist/index.js"
  post: "dist/index.js"
