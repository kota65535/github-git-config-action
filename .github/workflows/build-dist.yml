name: Build dist

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Keep the push token out of .git/config, where installed packages
          # could read it.
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: npm
      # Lifecycle scripts are skipped so that a dependency version proposed by
      # Renovate cannot run arbitrary code here. Only husky's prepare hook
      # relies on them, and that is not needed in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit dist if changed
        env:
          # A PAT rather than GITHUB_TOKEN, so the commit triggers the Test
          # workflow. Scoped to write access on this repository only.
          TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          git add dist
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: regenerate dist'
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" \
              "HEAD:${GITHUB_REF_NAME}"
