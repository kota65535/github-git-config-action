name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:


jobs:
  show-context:
    runs-on: ubuntu-latest
    steps:
      - name: Show github context object
        run: echo $JSON
        env:
          JSON: ${{ toJSON(github) }}
  
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: List local git config after checkout
        run: git config --local --list
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npx eslint "src/**/*.js"
      - name: Build
        run: npm run build
      - name: Check dist is up to date
        run: |
          git diff --exit-code -- dist || {
            echo "::error::dist is out of date. Run 'npm run build' and commit the result."
            exit 1
          }
      - name: Configure git
        uses: kota65535/github-git-config-action@v1
        with:
          github-token: ${{ secrets.PERSONAL_TOKEN }}
          config: |
            user.name: Tomohiko Ozawa
            user.email: kota65535@gmail.com
            branch.main.description: set via a wildcard config key
      - name: List local git config
        run: git config --local --list
      - name: List global git config
        run: git config --global --list
      - name: Checkout private repo by https
        run: git clone https://github.com/kota65535/tasks tasks1
      - name: Checkout private repo by ssh
        run: git clone git@github.com:kota65535/tasks.git tasks2
